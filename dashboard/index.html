<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peer-Priced Token Radar: pre-token protocols ranked by implied value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span><div><h1>Peer-Priced Token Radar</h1><p id="sub">Pre-token protocols priced off their own traded peers</p></div></div>
  <div class="chips" id="chips"></div>
</header>
<section class="model" id="model"></section>
<nav class="tabs" id="tabs">
  <button data-tab="board" class="on">Pre-token board</button>
  <button data-tab="traded">Already trading</button>
  <button data-tab="multiples">Peer multiples</button>
</nav>
<section class="filters" id="filters">
  <input id="q" type="search" placeholder="Search protocol or chain" aria-label="Search">
  <select id="cat" aria-label="Category"><option value="">All categories</option></select>
  <select id="chain" aria-label="Chain"><option value="">All chains</option></select>
  <select id="tvl" aria-label="Minimum TVL"><option value="0">Any TVL</option><option value="10000000">TVL $10M+</option><option value="50000000">TVL $50M+</option><option value="250000000">TVL $250M+</option></select>
  <label><input id="wl" type="checkbox"> Watchlist only</label>
  <label><input id="up" type="checkbox"> Growing this week</label>
  <span id="count" class="count"></span>
</section>
<main id="view"></main>
<aside id="detail" class="detail" hidden></aside>
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
